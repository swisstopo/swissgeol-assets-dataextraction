[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swissgeol-assets-dataextraction"
version = "0.1.0"
description = "Python project for geological document analysis."
readme = "README.md"
requires-python = ">=3.11,<3.14"

# Production-only dependencies for API runtime
dependencies = [
    "swissgeol-boreholes-dataextraction",
    "boto3==1.40.12",
    "fastapi==0.116.1",
    "boto3-stubs[s3]>=1.40.12,<2.0.0",
    "boto3-stubs[essentials]>=1.40.12,<2.0.0",
    "boto3-stubs[textract]>=1.40.12,<2.0.0",
    "fastapi[standard]==0.116.1",
    "joblib>=1.5.1,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "opencv-python>=4.12.0.88,<5.0.0.0",
    "pillow>=11.3.0,<12.0.0",
    "pymupdf==1.26.3",
    "pydantic==2.11.7",
    "pydantic_settings==2.10.1",
    "pyyaml>=6.0.2,<7.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "regex==2025.7.34",
    "scikit-learn>=1.7.1,<2.0.0",
    "shap==0.49.1",
    "shapely==2.1.2",
    "scipy==1.14.1",
    "tabulate>=0.9.0,<0.10.0",
    "tqdm>=4.67.1,<5.0.0",
    "xgboost==3.0.5",
    "uvicorn==0.35.0",
    "levenshtein==0.27.1",
]

[project.optional-dependencies]
# Development dependencies (not installed in Docker)
dev = [
    "matplotlib>=3.10.3,<4.0.0",
    "mlflow>=3.3.1,<4.0.0",
]
test = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
]
lint = [
    "pre-commit>=4.2.0,<5.0.0",
    "ruff>=0.11.0,<1.0.0",
]
experiment-tracking = [
    "mlflow>=3.1.4,<4.0.0",
    "pygit2>=1.18.1,<2.0.0"
]
all = [
    "swissgeol-assets-dataextraction[dev,test,lint,experiment-tracking]"
]

# ---- Configuration for UV
[tool.uv.sources]
swissgeol-boreholes-dataextraction = { url = "https://github.com/swisstopo/swissgeol-boreholes-dataextraction/releases/download/v1.0.160/swissgeol_boreholes_dataextraction-1.0.160-py3-none-any.whl" }

# ---- Configuration for Ruff
[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["D", "E", "F", "UP", "B", "SIM", "I"]
ignore = ["D102", "D105", "D107", "D100", "D103", "SIM108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
exclude-newer = "7 days"

# ---- Configuration for package building
[tool.hatch.build.targets.wheel]
packages = ["src"]

