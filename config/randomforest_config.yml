# === rf_config.yaml ===
model_type: random_forest

# Data parameters
train_folder_path: "data/single_pages_splits/train"
val_folder_path: "data/single_pages_splits/val"
ground_truth_file_path: "data/gt_single_pages.json"

# Feature names to track (27 features total)
feature_names:
  # Text/word features (6)
  - Words Per Line
  - Text Zone Density
  - Mean Left
  - Text Width
  - Indent Std Dev
  - Capitalization Ratio
  # Map features (5)
  - Num Map Keyword Lines
  - Grid Line Length Sum
  - Non Grid Line Length Sum
  - Line Angle Entropy
  - Line Score
  # Geo profile and diagram features (4)
  - Num Geo Profile Keywords
  - Num Unit Keyword
  - Y Scale OK
  - X Scale OK
  # Borehole features (12)
  - Num Valid Borehole Descriptions
  - Num Strip Logs
  - Num Tables
  - Num Boreholes
  - Num Sidebar Candidates
  - Num Good Sidebars
  - Best Sidebar Score
  - Sidebar Types Found
  - Average Sidebar Noise
  - Num Long Or Horizontal Lines
  - Text Line Count

# Model hyperparameters
hyperparameters:
  max_features: "log2"
  n_estimators: 100
  min_samples_split: 2
  max_depth: 25
  min_samples_leaf: 1
  random_state: 42

tuning:
  n_iter: 50
  scoring: "f1_micro"
  cv: 3
  param_grid:
    n_estimators: [50, 100, 150, 200, 250]
    max_depth: [10, 15, 20, 25, 30]
    max_features: ["sqrt", "log2"]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
