model_type: xgboost

train_folder_path: "data/single_pages_splits/train"
val_folder_path: "data/single_pages_splits/val"
ground_truth_file_path: "data/gt_single_pages.json"

# Feature names to track (26 features total)
feature_names:
  # Text/word features (6)
  - Words Per Line
  - Text Zone Density
  - Mean Left
  - Text Width
  - Indent Std Dev
  - Capitalization Ratio
  # Map features (5)
  - Num Map Keyword Lines
  - Grid Line Length Sum
  - Non Grid Line Length Sum
  - Line Angle Entropy
  - Line Score
  # Geo profile and diagram features (4)
  - Num Geo Profile Keywords
  - Num Unit Keyword
  - Y Scale OK
  - X Scale OK
  # Borehole features (11)
  - Num Valid Borehole Descriptions
  - Num Strip Logs
  - Num Tables
  - Num Boreholes
  - Num Sidebar Candidates
  - Num Good Sidebars
  - Best Sidebar Score
  - Sidebar Types Found
  - Average Sidebar Noise
  - Num All Geometric Lines
  - Text Line Count


hyperparameters:
  n_estimators: 600
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 1
  eval_metric: mlogloss

tuning:
  n_iter: 50
  cv: 3
  param_grid:
    n_estimators: [100, 200, 300, 400, 500, 600]
    max_depth: [4, 5, 6, 7, 8]
    learning_rate: [0.01, 0.03, 0.05, 0.1, 0.2]
    subsample: [0.6, 0.8, 1.0]
    colsample_bytree: [0.6, 0.8, 1.0]