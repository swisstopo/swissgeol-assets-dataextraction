model_type: xgboost

train_folder_path: "data/single_pages_splits/train"
val_folder_path: "data/single_pages_splits/validation"
ground_truth_file_path: "data/gt_single_pages.json"
# Enable OOD (use unknown class as outliers)
ood_use: true

# Feature names to track (24 features total)
feature_names:
  # Text/word features (7)
  - Keywords List
  - Words Per Line
  - Word Density
  - Mean Left
  - Text Width
  - Indent Std Dev
  - Capitalization Ratio
  # Map features (5)
  - Num Map Keyword Lines
  - Grid Line Length Sum
  - Non Grid Line Length Sum
  - Line Angle Entropy
  - Line Score
  # Geo profile and diagram features (4)
  - Num Geo Profile Keywords
  - Num Unit Keyword
  - Y Scale OK
  - X Scale OK
  # Borehole features (8)
  - Num Valid Borehole Descriptions
  - Num Strip Logs
  - Num Tables
  - Num Boreholes
  - Num Good Sidebars
  - Best Sidebar Score
  - Num Long or Horizontal Lines
  - Text Line Count

hyperparameters:
  n_estimators: 500
  max_depth: 5
  learning_rate: 0.1
  subsample: 0.6
  colsample_bytree: 0.8
  eval_metric: mlogloss

hyperparameters_ood:
  # Parameters for out of distribution (OOD) detection
  ood_mode: "gmm"
  ood_confidence: 0.05

tuning:
  cv: 3
  scoring: "f1_macro"
  param_grid:
    n_estimators: [400, 500, 600]
    max_depth: [4, 5, 6]
    learning_rate: [0.05, 0.1, 0.2]
    subsample: [0.4, 0.6, 0.8]
    colsample_bytree: [0.6, 0.8, 1.0]
    ood_mode: ["gmm", "hnorm"]
    ood_confidence: [0.01, 0.05, 0.1, 0.5, 0.95]
