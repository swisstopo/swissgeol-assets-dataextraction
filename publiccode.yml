publiccodeYmlVersion: 0.5.0
name: swissgeol-assets-dataextraction
applicationSuite: swissgeol.ch
url: https://github.com/swisstopo/swissgeol-assets-dataextraction
platforms:
  - web
developmentStatus: beta
softwareType: standalone/backend
organisation:
  uri: https://ld.admin.ch/office/IV.1.5a
  name: Bundesamt für Landestopografie (swisstopo)
description:
  en:
    shortDescription: >-
      Classification pipeline for categorising PDF pages from geological
      reports into document classes
    longDescription: >-
      A pipeline that classifies pages from geological PDF files into various categories
      such as "map" or "borehole profile", and extracts relevant metadata from the files.
      The output can be used to automatically generate a table of contents for each document.
      The pipeline is used in this way for the geological documents that are published on the
      web application assets.swissgeol.ch. The repository supports two classifier approaches:
      a feature-based XGBoost model (default) and Pixtral Large via Amazon Bedrock.
    features:
      - Classify PDF pages into 8 geological document classes
      - Feature-based XGBoost classifier with SHAP explainability
      - Pixtral Large classifier via Amazon Bedrock
      - Versioned REST API
      - Local MLflow experiment tracking
