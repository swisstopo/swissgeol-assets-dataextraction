name: pipeline_run

on:
  pull_request:
  push:
    branches: [main]

env:
  MLFLOW_TRACKING: "False"

jobs:
  pipeline_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v8
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Install dependencies and run pipeline
        shell: bash
        run: |
          uv sync
          echo "Running pipeline with treebased classifier"
          uv run python main.py -i examples/example_pdf.pdf -c treebased -p models/stable/model.joblib
