name: pipeline_run

on:
  pull_request:
  push:
    branches: [main]

env:
  MLFLOW_TRACKING: "False"

jobs:
  pipeline_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and run pipeline
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          echo "Running pipeline with treebased classifier"
          python main.py -i examples/example_pdf.pdf -c treebased -p models/stable/model.joblib
